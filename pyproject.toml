[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dfir-triage"
dynamic = ["version"]
description = "Parse Windows EVTX, Shimcache, Amcache and registry artifacts into one triage timeline."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Yug Patel" }]
dependencies = [
    "python-evtx>=0.8",
    "python-registry>=1.3",
    "pandas>=2.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.32"]
llm = ["groq>=0.9", "python-dotenv>=1.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.dynamic]
version = { attr = "dfir_triage.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Long prose strings (LLM prompt, UI copy) read better unwrapped.
"src/dfir_triage/summarizer.py" = ["E501"]
"src/dfir_triage/app.py" = ["E501"]
